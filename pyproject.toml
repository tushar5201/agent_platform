[project]
name = "agent-platform"
version = "0.1.0"
description = "Reusable LangGraph + MCP chat agent service with per-user auth passthrough and guardrails"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.5,<2",
    "langgraph>=1.2,<2",
    "langchain-groq>=1.2,<2",
    "langchain-nvidia-ai-endpoints>=1.0",
    "langchain-mcp-adapters>=0.3,<1",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "aiosqlite>=0.22",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "fastmcp>=3.4,<4",
    "python-dotenv>=1.0",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["core"]

[tool.pytest.ini_options]
testpaths = ["core/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["core"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
